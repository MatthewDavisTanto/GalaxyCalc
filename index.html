<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CALC. — Calculator</title>

    <meta
        name="description"
        content="A simple interactive calculator built with HTML, CSS and JavaScript."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="galaxy"></canvas>

    <header class="site-header">

        <a href="#" class="logo">
            CALC<span>.</span>
        </a>

        <a
            href="https://github.com/MatthewDavisTanto"
            target="_blank"
            rel="noopener noreferrer"
            class="github-link"
        >
            GITHUB ↗
        </a>

    </header>

    <main>

        <section class="calculator-section">

            <div class="calculator-card">

                <div class="calculator-top">
                    <span>CALCULATOR</span>
                    <span>01</span>
                </div>

                <div class="display">

                    <div
                        class="expression"
                        id="expression"
                    ></div>

                    <div
                        class="result"
                        id="result"
                    >
                        0
                    </div>

                </div>

                <div class="buttons">

                    <button
                        type="button"
                        class="function"
                        data-action="clear"
                    >
                        AC
                    </button>

                    <button
                        type="button"
                        class="function"
                        data-action="delete"
                    >
                        DEL
                    </button>

                    <button
                        type="button"
                        class="function"
                        data-action="percent"
                    >
                        %
                    </button>

                    <button
                        type="button"
                        class="operator"
                        data-value="÷"
                    >
                        ÷
                    </button>

                    <button type="button" data-value="7">7</button>
                    <button type="button" data-value="8">8</button>
                    <button type="button" data-value="9">9</button>

                    <button
                        type="button"
                        class="operator"
                        data-value="×"
                    >
                        ×
                    </button>

                    <button type="button" data-value="4">4</button>
                    <button type="button" data-value="5">5</button>
                    <button type="button" data-value="6">6</button>

                    <button
                        type="button"
                        class="operator"
                        data-value="-"
                    >
                        −
                    </button>

                    <button type="button" data-value="1">1</button>
                    <button type="button" data-value="2">2</button>
                    <button type="button" data-value="3">3</button>

                    <button
                        type="button"
                        class="operator"
                        data-value="+"
                    >
                        +
                    </button>

                    <button
                        type="button"
                        class="zero"
                        data-value="0"
                    >
                        0
                    </button>

                    <button type="button" data-value=".">
                        .
                    </button>

                    <button
                        type="button"
                        class="equals"
                        data-action="calculate"
                    >
                        =
                    </button>

                </div>

                <p
                    class="error-message"
                    id="error-message"
                ></p>

            </div>

        </section>

    </main>

    <footer class="site-footer">

        <span>
            © 2026 Matthew Davis Tanto
        </span>

        <a
            href="https://github.com/MatthewDavisTanto"
            target="_blank"
            rel="noopener noreferrer"
        >
            GitHub
        </a>

    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.138.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.138.1/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>

</body>
</html>
