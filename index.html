<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GALACTIC AGE — Age Calculator</title>

    <meta
        name="description"
        content="Calculate your age on different planets with Galactic Age."
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <canvas id="galaxy"></canvas>

    <header class="site-header">

        <a href="#" class="logo">
            GALACTIC<span>.</span>
        </a>

        <a
            href="https://github.com/MatthewDavisTanto"
            target="_blank"
            rel="noopener noreferrer"
            class="github-link"
        >
            GITHUB ↗
        </a>

    </header>

    <main>

        <section class="calculator-section">

            <div class="calculator-card">

                <div class="calculator-top">
                    <span>AGE CALCULATOR</span>
                    <span>01</span>
                </div>

                <div class="calculator-intro">

                    <p class="intro-label">
                        YOUR AGE, ACROSS THE UNIVERSE
                    </p>

                    <h1>
                        GALACTIC<br>
                        AGE
                    </h1>

                    <p>
                        Discover how old you would be
                        on another planet.
                    </p>

                </div>

                <div class="input-group">

                    <label for="birth-date">
                        DATE OF BIRTH
                    </label>

                    <input
                        type="date"
                        id="birth-date"
                    >

                </div>

                <div class="input-group">

                    <label for="planet">
                        SELECT PLANET
                    </label>

                    <select id="planet">

                        <option value="">
                            Choose a planet
                        </option>

                        <option value="earth">
                            Earth
                        </option>

                        <option value="mercury">
                            Mercury
                        </option>

                        <option value="venus">
                            Venus
                        </option>

                        <option value="mars">
                            Mars
                        </option>

                        <option value="jupiter">
                            Jupiter
                        </option>

                        <option value="saturn">
                            Saturn
                        </option>

                        <option value="uranus">
                            Uranus
                        </option>

                        <option value="neptune">
                            Neptune
                        </option>

                    </select>

                </div>

                <button
                    type="button"
                    class="calculate-button"
                    id="calculate-button"
                >
                    CALCULATE AGE
                </button>

                <div class="result-area">

                    <p class="result-label">
                        YOUR GALACTIC AGE
                    </p>

                    <div
                        class="result"
                        id="result"
                    >
                        —
                    </div>

                    <p
                        class="result-description"
                        id="result-description"
                    >
                        Enter your birth date and select a planet.
                    </p>

                </div>

                <p
                    class="error-message"
                    id="error-message"
                ></p>

            </div>

        </section>

    </main>

    <footer class="site-footer">

        <span>
            © 2026 Matthew Davis Tanto
        </span>

        <a
            href="https://github.com/MatthewDavisTanto"
            target="_blank"
            rel="noopener noreferrer"
        >
            GitHub
        </a>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/three@0.138.1/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.138.1/examples/js/controls/OrbitControls.js"></script>
    <script src="script.js"></script>

</body>
</html>
